name: Feature request
description: Suggest an idea or workflow improvement for EZLibrary
title: "[Feature]: "
# `roadmap` puts the request straight onto the public board at
# https://tawaunl.github.io/EZLibrary/roadmap/ — remove the label to take it off.
labels: ["enhancement", "roadmap"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping shape EZLibrary! Describe the DJ or library workflow you'd like to improve.

        Your request goes straight onto the [public roadmap](https://tawaunl.github.io/EZLibrary/roadmap/),
        where anyone can 👍 it. Vote count is the strongest signal for what gets built next, so it's worth
        checking whether someone has already asked for this and upvoting theirs instead.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Is your feature request related to a frustration or gap? Describe it.
      placeholder: I'm always frustrated when...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or features you've considered.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context, mockups, or screenshots about the request here.
    validations:
      required: false

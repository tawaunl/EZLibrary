name: Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Let a queued deploy finish rather than cancelling it: a half-published site is
# worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # `site/features/` is generated by Scripts/build-site-pages.py and the
      # output is committed. Regenerating here proves the committed HTML still
      # matches the script, so the two can't quietly drift apart.
      - name: Check generated feature pages are up to date
        run: |
          ./Scripts/build-site-pages.py > /dev/null
          if ! git diff --quiet -- site/features; then
            echo "::error::site/features/ is out of date. Run ./Scripts/build-site-pages.py and commit the result."
            git --no-pager diff --stat -- site/features
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4

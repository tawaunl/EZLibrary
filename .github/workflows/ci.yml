name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: these jobs only need to read the repository.
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show Swift version
        run: swift --version

      # Building the products and the test bundle in one invocation lets
      # SwiftPM schedule them as a single dependency graph, instead of two
      # sequential passes that each wait on the shared EZLibraryCore module.
      - name: Build
        run: swift build --build-tests

      # `--no-parallel` because EZLibraryCore's write-safety test seams
      # (`SeratoBackupBeforeWrite.backupDirectory`, `SeratoProcessGuard`)
      # are process-wide mutable statics that several suites override at once.
      # Run in parallel, one suite redirects another's backups mid-write and
      # the build fails at random (~1 in 14 runs measured). Serializing costs
      # under a second here. The real fix is to scope those seams per test
      # (e.g. task-local) rather than sharing one global.
      - name: Run tests
        run: swift test --skip-build --no-parallel

  lint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install SwiftLint (if needed)
        run: which swiftlint || brew install swiftlint

      # Lightweight: reports style issues as annotations. Only error-severity
      # violations fail the job (see .swiftlint.yml). Add `--strict` here later
      # to also fail on warnings once they've been cleaned up.
      - name: Run SwiftLint
        run: swiftlint lint --reporter github-actions-logging

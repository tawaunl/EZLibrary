name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: these jobs only need to read the repository.
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show Swift version
        run: swift --version

      # Building the products and the test bundle in one invocation lets
      # SwiftPM schedule them as a single dependency graph, instead of two
      # sequential passes that each wait on the shared EZLibraryCore module.
      - name: Build
        run: swift build --build-tests

      # `--no-parallel` because `SeratoBackupBeforeWrite.backupDirectory` is
      # still a process-wide mutable static that several suites override at
      # once. Run in parallel, one suite redirects another's backups mid-write
      # and the build fails at random (~1 in 14 runs measured). Serializing
      # costs under a second here.
      #
      # The `SeratoProcessGuard` half of that problem is fixed: tests now bind
      # a task-local via `TestSeratoEnvironment.withSeratoRunning`, so a test
      # exercising the refusal is no longer visible to anything running beside
      # it. Once the backup directory gets the same treatment this flag can go.
      - name: Run tests
        run: swift test --skip-build --no-parallel

      # `EZLibrarySnapshotKit` is the only target a phone will link against,
      # and it is kept portable by construction rather than by conditional
      # compilation. That guarantee is only real if something builds it for
      # iOS on every change — cross-platform code that is never compiled for
      # the other platform rots silently.
      - name: Build snapshot kit for iOS
        run: |
          swift build --target EZLibrarySnapshotKit \
            --sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            --triple arm64-apple-ios17.0-simulator

      # The iOS app's sources live outside the SwiftPM graph — they need an
      # Xcode project to link and run. They can still be type-checked against
      # the iOS build of the kit, which catches the breakage that actually
      # happens: the kit's API moving under them. Depends on the step above
      # having produced the module for this triple.
      - name: Type-check iOS app sources
        run: |
          xcrun --sdk iphonesimulator swiftc \
            -target arm64-apple-ios17.0-simulator \
            -typecheck \
            -I .build/arm64-apple-ios-simulator/debug/Modules \
            Mobile/EZLibraryMobile/*.swift

  lint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install SwiftLint (if needed)
        run: which swiftlint || brew install swiftlint

      # Lightweight: reports style issues as annotations. Only error-severity
      # violations fail the job (see .swiftlint.yml). Add `--strict` here later
      # to also fail on warnings once they've been cleaned up.
      - name: Run SwiftLint
        run: swiftlint lint --reporter github-actions-logging
